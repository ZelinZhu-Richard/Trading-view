[project]
name = "market-workbench"
version = "0.1.0"
description = "Local charting and reproducible portfolio research"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pyarrow>=19,<25",
  "httpx>=0.28,<1",
  "websockets>=15,<17",
  "python-multipart>=0.0.20,<1",
  "exchange-calendars>=4.8,<5",
  "psutil>=7,<9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
